name: Pages static checks

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'tools/check_pages_site.py'
      - '.github/workflows/pages-static-checks.yml'
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'tools/check_pages_site.py'
      - '.github/workflows/pages-static-checks.yml'

permissions:
  contents: read

jobs:
  verify-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/check_pages_site.py
